x-logging:
  &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  identifier:
    image: semtech/mu-identifier:1.11.0
    environment:
      SESSION_COOKIE_SECURE: "on"
    logging: *default-logging
    restart: always
    labels:
      - "logging=true"
  dispatcher:
    image: semtech/mu-dispatcher:2.1.1
    volumes:
      - ./config/dispatcher:/config
    logging: *default-logging
    restart: always
    labels:
      - "logging=true"
  frontend:
    image: kanselarij/frontend-overlegcomite:1.8.2
    links:
      - identifier:backend
    logging: *default-logging
    restart: always
    labels:
      - "logging=true"
  migrations:
    image: semtech/mu-migrations-service:0.9.0
    volumes:
      - ./config/migrations:/data/migrations
    environment:
      MU_SPARQL_ENDPOINT: "http://triplestore:8890/sparql"
    logging: *default-logging
    restart: always
    labels:
      - "logging=true"
  database:
    image: semtech/sparql-parser:0.0.15
    volumes:
      - ./config/authorization:/config
      - ./data/authorization:/data
    logging: *default-logging
    restart: always
    labels:
      - "logging=true"
  triplestore:
    image: redpencil/virtuoso:1.4.0
    environment:
      SPARQL_UPDATE: "true"
      DEFAULT_GRAPH: "http://mu.semte.ch/application"
    volumes:
      - ./data/db:/data
      - ./config/db/virtuoso.ini:/data/virtuoso.ini
    logging: *default-logging
    restart: always
    labels:
      - "logging=true"
  delta-notifier:
    image: semtech/mu-delta-notifier:0.4.0
    volumes:
      - ./config/delta:/config
    logging: *default-logging
    restart: always
    labels:
      - "logging=true"
  login:
    image: kanselarij/acmidm-login-service:latest
    environment:
      MU_APPLICATION_AUTH_DISCOVERY_URL: "https://authenticatie-ti.vlaanderen.be/op/.well-known/openid-configuration"
      MU_APPLICATION_AUTH_CLIENT_ID: "b882fde4-56e4-4423-be1a-6b424ea6f7b1"
      MU_APPLICATION_AUTH_CLIENT_SECRET: "THIS IS OUR SECRET"
      MU_APPLICATION_AUTH_REDIRECT_URI: "https://overlegcomite-dev.vlaanderen.be/authorization/callback"
      MU_APPLICATION_AUTH_ROLE_CLAIM: "dkb_overlegcomite_rol_3d"
      MU_APPLICATION_AUTH_ROLE_CLAIM_REGEX: "^([-\\d\\w]*):"
      MU_APPLICATION_RESOURCE_BASE_URI: "http://kanselarij.vo.data.gift/"
      DEBUG_LOG_TOKENSETS: "true"
      LOG_SINK_URL: "http://sink"
    logging: *default-logging
    restart: always
    labels:
      - "logging=true"
  cache:
    image: semtech/mu-cache:2.1.0
    links:
      - resource:backend
    logging: *default-logging
    restart: always
    labels:
      - "logging=true"
  resource:
    image: semtech/mu-cl-resources:1.27.2
    environment:
      CACHE_CLEAR_PATH: "http://cache/.mu/clear-keys"
    volumes:
      - ./config/resources:/config
    logging: *default-logging
    restart: always
    labels:
      - "logging=true"
  file:
    image: semtech/mu-file-service:3.5.0
    volumes:
      - ./data/files:/share
    logging: *default-logging
    restart: always
    labels:
      - "logging=true"
  range-file:
    image: mikidi/js-file-service:0.1.0
    volumes:
      - ./data/files:/share
    logging: *default-logging
    restart: always
    labels:
      - "logging=true"
  search:
    image: semtech/mu-search:0.12.1
    environment:
      JRUBY_OPTIONS: "-J-Xmx12g" # overwrite for development
      NUMBER_OF_THREADS: "6"
    volumes:
      - ./config/search:/config
      - ./data/files:/data
      - ./data/tika/cache:/cache
    logging: *default-logging
    restart: always
    labels:
      - "logging=true"
  elasticsearch:
    image: semtech/mu-search-elastic-backend:1.3.1
    volumes:
      - ./data/elasticsearch/:/usr/share/elasticsearch/data
    logging: *default-logging
    restart: always
    labels:
      - "logging=true"
  tika:
    image: semtech/mu-search-tika-backend:1.0.0
    logging: *default-logging
    restart: always
    labels:
      - "logging=true"
  distribution:
    image: kanselarij/oc-distributor:0.2.2
    environment:
      LOG_SPARQL_ALL: "false"
      DEBUG_AUTH_HEADERS: "false"
    logging: *default-logging
    restart: always
    labels:
      - "logging=true"
  sink:
    image: lblod/sink-service:1.0.0
    logging: *default-logging
    restart: always
    labels:
      - "logging=true"
